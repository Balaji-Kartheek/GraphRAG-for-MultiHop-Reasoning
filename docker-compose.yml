version: '3.8'

services:
  # MongoDB for article storage
  mongodb:
    image: mongo:7.0
    container_name: graphrag_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: graphrag_news
    volumes:
      - mongodb_data:/data/db
    networks:
      - graphrag_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j for knowledge graph
  neo4j:
    image: neo4j:5.15-community
    container_name: graphrag_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphrag_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - graphrag_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Service
  graphrag_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag_app
    ports:
      - "8000:8000"  # FastAPI
      - "8501:8501"  # Streamlit
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=graphrag_password
    volumes:
      - ./:/app
      - chroma_data:/app/chroma_db
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - graphrag_network
    command: >
      sh -c "python test_connections.py && 
             uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload"

  # Streamlit UI (separate service)
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag_streamlit
    ports:
      - "8502:8501"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=graphrag_password
    volumes:
      - ./:/app
      - chroma_data:/app/chroma_db
    depends_on:
      - graphrag_app
    networks:
      - graphrag_network
    command: streamlit run app/streamlit_app.py --server.port=8501

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:

networks:
  graphrag_network:
    driver: bridge